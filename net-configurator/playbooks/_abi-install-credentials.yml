---
- name: Require selected site credentials | {{ 'attempt=' ~ (abi_boot_plan.installation_attempt_id | default(abi_boot_plan.inspection_run_id))
    ~ ' | node=' ~ __abi_install_credential_node }}
  ansible.builtin.assert:
    that:
      - bmc_credentials[__abi_install_credential_node].username | default('') | length > 0
      - bmc_credentials[__abi_install_credential_node].password | default('') | length > 0
  when: __abi_install_credential_phase == 'validate'
  no_log: true
- name: Adapt selected credentials without publishing secrets | {{ 'attempt=' ~ (abi_boot_plan.installation_attempt_id | default(abi_boot_plan.inspection_run_id))
    ~ ' | node=' ~ __abi_install_credential_node }}
  ansible.builtin.set_fact:
    abi_install_driver_credentials: '{{ abi_install_driver_credentials | combine({__abi_install_credential_node: bmc_credentials[__abi_install_credential_node]})
      }}'
  when: __abi_install_credential_phase == 'adapt'
  no_log: true
...
