---
- name: Adapt only the reviewed initial fleet credentials
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Require selected site credentials | {{ 'attempt=' ~ (abi_boot_plan.installation_attempt_id | default(abi_boot_plan.inspection_run_id))
        }}
      ansible.builtin.include_tasks: _abi-install-credentials.yml
      vars:
        __abi_install_credential_phase: validate
      loop: '{{ abi_boot_plan.node_names }}'
      loop_control:
        loop_var: __abi_install_credential_node
        label: '{{ __abi_install_credential_node }}'
      when: abi_boot_plan.profile.method != 'operator_manual'
    - name: Initialize private boot credentials
      ansible.builtin.set_fact:
        abi_install_driver_credentials: {}
      no_log: true
    - name: Adapt selected credentials without publishing secrets | {{ 'attempt=' ~ (abi_boot_plan.installation_attempt_id | default(abi_boot_plan.inspection_run_id))
        }}
      ansible.builtin.include_tasks: _abi-install-credentials.yml
      vars:
        __abi_install_credential_phase: adapt
      loop: '{{ abi_boot_plan.node_names }}'
      loop_control:
        loop_var: __abi_install_credential_node
        label: '{{ __abi_install_credential_node }}'
      when: abi_boot_plan.profile.method != 'operator_manual'
    - name: Bind the reviewed boot handoff
      ansible.builtin.set_fact:
        abi_install_driver_plan: '{{ abi_boot_plan }}'
- name: Install or resume through the reusable collection
  ansible.builtin.import_playbook: rhvp.baremetal_ocp.install_abi
...
