#
# Gate-6 operational adapter.  The collection remains the owner of the
# Ironic lifecycle; this playbook only validates integrated handoff inputs and
# binds the prepared single-candidate artifact to that collection playbook.

- name: Authorize one controlled physical inspection
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    controlled_inspection_candidate: ""
    controlled_inspection_authorize_physical_boot: ""
    controlled_inspection_report_path: ""
    controlled_inspection_failure_report_path: ""
    controlled_inspection_cleanup_report_path: ""
    controlled_inspection_collection_playbook: ""

  tasks:
    - name: Validate Gate-6 authorization and integrated inputs
      ansible.builtin.assert:
        that:
          - controlled_inspection_candidate | length > 0
          - controlled_inspection_authorize_physical_boot == controlled_inspection_candidate
          - controlled_inspection_report_path is match('^/')
          - not (controlled_inspection_report_path is match('^/tmp(?:/|$)'))
          - controlled_inspection_collection_playbook is match('^/')
          - preflight_inspection_nodes | default([]) | length == 1
          - preflight_inspection_nodes[0].name | default('') == controlled_inspection_candidate
          - ironic_image_resolve_ocp_release_image | default('') | length > 0
          - ironic_image_resolve_pull_secret_path | default('') | length > 0
          - ironic_preprovisioning_media_nmstate_dir | default('') | length > 0
          - ironic_deploy_provisioning_ip | default('') | length > 0
          - ironic_deploy_provisioning_interface | default('') | length > 0
        fail_msg: >-
          Gate 6 requires one prepared candidate, matching explicit physical-boot
          authorization, an absolute non-temporary report path, and complete
          release-matched preflight inputs.
      no_log: true

    - name: Require the collection inspection playbook
      ansible.builtin.stat:
        path: "{{ controlled_inspection_collection_playbook }}"
      register: __controlled_inspection_collection_playbook

    - name: Resolve all controlled inspection artifact destinations
      ansible.builtin.set_fact:
        __controlled_inspection_failure_path: >-
          {{ controlled_inspection_failure_report_path
             | default(controlled_inspection_report_path
                       | regex_replace('(-inventory)?[.]ya?ml$', '') ~ '-failure.yaml', true) }}
        __controlled_inspection_cleanup_path: >-
          {{ controlled_inspection_cleanup_report_path
             | default(controlled_inspection_report_path
                       | regex_replace('(-inventory)?[.]ya?ml$', '') ~ '-cleanup.yaml', true) }}

    - name: Validate distinct durable YAML artifact destinations
      ansible.builtin.assert:
        that:
          - __controlled_inspection_collection_playbook.stat.isreg | default(false)
          - item is match('^/')
          - not (item is match('^/tmp(?:/|$)'))
          - item is search('[.]yaml$')
          - item is not search('[()]')
          - >-
            [controlled_inspection_report_path, __controlled_inspection_failure_path,
             __controlled_inspection_cleanup_path] | unique | length == 3
        fail_msg: >-
          Inventory, failure, and cleanup paths must be distinct absolute
          non-temporary .yaml destinations without parentheses. The collection
          inspection playbook must exist.
      loop:
        - "{{ controlled_inspection_report_path }}"
        - "{{ __controlled_inspection_failure_path }}"
        - "{{ __controlled_inspection_cleanup_path }}"

    - name: Inspect all controlled inspection artifact destinations
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      loop:
        - "{{ controlled_inspection_report_path }}"
        - "{{ __controlled_inspection_failure_path }}"
        - "{{ __controlled_inspection_cleanup_path }}"
      register: __controlled_inspection_existing_artifacts

    - name: Refuse to overwrite prior inspection evidence
      ansible.builtin.assert:
        that:
          - not item.stat.exists
        fail_msg: >-
          Inspection destination already exists: {{ item.item }}.
          Preserve prior evidence before reusing the single-node test directory.
      loop: "{{ __controlled_inspection_existing_artifacts.results }}"
      loop_control:
        label: "{{ item.item }}"

- name: Run the authorized collection inspection lifecycle
  import_playbook: "{{ controlled_inspection_collection_playbook }}"
  vars:
    inspect_cluster_nodes: "{{ preflight_inspection_nodes }}"
    inspect_cluster_report_path: "{{ controlled_inspection_report_path }}"
    inspect_cluster_failure_report_path: "{{ hostvars['localhost']['__controlled_inspection_failure_path'] }}"
    inspect_cluster_cleanup_report_path: "{{ hostvars['localhost']['__controlled_inspection_cleanup_path'] }}"
