---
- name: >-
    Require credentials for exactly the selected nodes | {{ 'run=' ~ fleet_wipe_runtime_plan.run_id ~ ' | node='
       ~ __fleet_wipe_credential_node.name }}
  ansible.builtin.assert:
    that:
      - bmc_credentials[__fleet_wipe_credential_node.name].username | default('') | length > 0
      - bmc_credentials[__fleet_wipe_credential_node.name].password | default('') | length > 0
  when: __fleet_wipe_credential_phase == 'validate'
  no_log: true

- name: >-
    Adapt only the selected vaulted credentials | {{ 'run=' ~ fleet_wipe_runtime_plan.run_id ~ ' | node='
       ~ __fleet_wipe_credential_node.name }}
  ansible.builtin.set_fact:
    fleet_native_disk_clean_driver_credentials: >-
      {{ fleet_native_disk_clean_driver_credentials
         | combine({__fleet_wipe_credential_node.name: bmc_credentials[__fleet_wipe_credential_node.name]}) }}
  when: __fleet_wipe_credential_phase == 'adapt'
  no_log: true
...
