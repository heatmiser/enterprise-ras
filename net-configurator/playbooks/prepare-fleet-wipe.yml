---
- name: Prepare fresh native cleaning networking and release inputs without hardware
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Load the reviewed collection settings and shared pull secret
      ansible.builtin.include_vars:
        file: "{{ item }}"
      loop:
        - "{{ fleet_wipe_runtime_plan.cluster_vars }}"
        - "{{ playbook_dir }}/../.era-secrets/air-secrets.yml"
      no_log: true

    - name: Resolve fresh routes for every selected callback address
      ansible.builtin.command:
        argv: [ip, -j, route, get, "{{ item.devices.bond_ip }}"]
      loop: "{{ fleet_wipe_runtime_plan.authorized_nodes }}"
      register: __wipe_routes
      changed_when: false

    - name: Require a single shared bastion source address and interface
      ansible.builtin.assert:
        that:
          - __route.dev | default('') | length > 0
          - __route.prefsrc | default(__route.src | default('')) | length > 0
          - __route.dev == __first.dev
          - __route.prefsrc | default(__route.src | default('')) == __first.prefsrc | default(__first.src | default(''))
      vars:
        __route: "{{ (item.stdout | from_json) | first }}"
        __first: "{{ (__wipe_routes.results[0].stdout | from_json) | first }}"
      loop: "{{ __wipe_routes.results }}"

    - name: Require the shared OCP pull secret before local materialization
      ansible.builtin.assert:
        that:
          - ocp_pull_secret | default('') | length > 0
      no_log: true

    - name: Prepare the existing local pull-secret directory
      ansible.builtin.file:
        path: "{{ lookup('ansible.builtin.env', 'HOME') }}/.era-secrets"
        state: directory
        mode: "0700"

    - name: Materialize the shared pull secret through the existing authfile pattern
      ansible.builtin.copy:
        content: "{{ ocp_pull_secret | trim }}\n"
        dest: "{{ lookup('ansible.builtin.env', 'HOME') }}/.era-secrets/pull-secret.json"
        mode: "0600"
      no_log: true

    - name: Prepare the same immutable release with fresh route evidence
      ansible.builtin.include_role:
        name: rhvp.baremetal_ocp.inspection_preflight_prepare
      vars:
        ocp_ee_image: "{{ fleet_wipe_runtime_plan.original_provenance.ee_image }}"
        pull_secret_path: "{{ lookup('ansible.builtin.env', 'HOME') }}/.era-secrets/pull-secret.json"
        inspection_preflight_prepare_candidate_name: "{{ fleet_wipe_runtime_plan.authorized_nodes[0].name }}"
        inspection_preflight_prepare_nmstate_dir: "{{ fleet_wipe_runtime_plan.nmstate_dir }}"
        inspection_preflight_prepare_early_network_path: >-
          {{ fleet_wipe_runtime_plan.early_network_dir }}/{{ fleet_wipe_runtime_plan.authorized_nodes[0].name }}.yaml
        inspection_preflight_prepare_output_path: "{{ fleet_wipe_bundle }}/preflight-vars.yaml"
        inspection_preflight_prepare_provisioning_ip: >-
          {{ (__wipe_routes.results[0].stdout | from_json | first).prefsrc
             | default((__wipe_routes.results[0].stdout | from_json | first).src) }}
        inspection_preflight_prepare_provisioning_interface: "{{ (__wipe_routes.results[0].stdout | from_json | first).dev }}"
        inspection_preflight_prepare_callback_target_ip: "{{ fleet_wipe_runtime_plan.authorized_nodes[0].devices.bond_ip }}"
        inspection_preflight_prepare_expected_ocp_version: "{{ fleet_wipe_runtime_plan.original_provenance.installer_version }}"

    - name: Retain all fresh callback routes
      ansible.builtin.copy:
        dest: "{{ fleet_wipe_bundle }}/callback-routes.yaml"
        mode: "0600"
        content: >-
          {{ {'nodes': fleet_wipe_runtime_plan.authorized_nodes | map(attribute='name') | list,
              'routes': __wipe_routes.results} | to_nice_yaml }}

    - name: Seal preparation without granting execution authority
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - "{{ playbook_dir }}/../scripts/prepare-fleet-wipe.py"
          - seal
          - --arch
          - "{{ fleet_wipe_arch }}"
          - --site
          - "{{ fleet_wipe_site }}"
          - --bundle
          - "{{ fleet_wipe_bundle }}"
      changed_when: true
...
